<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1013" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>XAYNO Journal</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

      :root {
        --bg: #070b10;
        --bg-2: #0d1419;
        --panel: rgba(17, 24, 29, 0.82);
        --panel-alt: rgba(22, 31, 37, 0.82);
        --glass: rgba(255, 255, 255, 0.04);
        --glass-strong: rgba(255, 255, 255, 0.06);
        --line: rgba(255, 255, 255, 0.10);
        --text: #edf7f4;
        --text-muted: #c7d4d0;
        --text-dim: #7a8b88;
        --green: #00f5a0;
        --green-soft: rgba(0, 245, 160, 0.14);
        --cyan: #00d4f5;
        --red: #ff4a6b;
        --red-soft: rgba(255, 74, 107, 0.12);
        --yellow: #fbbf24;
        --shadow: rgba(0, 0, 0, 0.32);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 15% 0%, rgba(0, 245, 160, 0.08), transparent 28%),
          radial-gradient(circle at 85% 100%, rgba(0, 212, 245, 0.08), transparent 30%),
          linear-gradient(180deg, #050a0f 0%, #0a1117 50%, #070d12 100%);
        color: var(--text);
        font-family: 'Vazirmatn', Tahoma, sans-serif;
      }

      body {
        padding: 18px 18px 42px;
      }

      button, input, select, textarea {
        font: inherit;
      }

      .xh-root {
        position: relative;
        max-width: 1260px;
        margin: 0 auto;
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 26px;
        background: rgba(7, 11, 16, 0.68);
        box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
        overflow: hidden;
        backdrop-filter: blur(24px);
      }

      .xh-root::before,
      .xh-root::after {
        content: "";
        position: absolute;
        inset: auto;
        border-radius: 50%;
        filter: blur(65px);
        pointer-events: none;
      }

      .xh-root::before {
        width: 260px;
        height: 260px;
        right: -50px;
        top: -60px;
        background: rgba(0, 245, 160, 0.10);
      }

      .xh-root::after {
        width: 280px;
        height: 280px;
        left: -90px;
        bottom: -80px;
        background: rgba(0, 212, 245, 0.10);
      }

      .xh-shell {
        position: relative;
        z-index: 1;
      }

      .xh-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding: 22px 30px 18px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        background: linear-gradient(180deg, rgba(0,0,0,0.14), rgba(255,255,255,0.02));
        backdrop-filter: blur(18px);
      }

      .xh-brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .xh-wordmark {
        position: relative;
        display: inline-flex;
        align-items: center;
        font-family: 'Vazirmatn', sans-serif;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 5px;
        color: var(--green);
        direction: ltr;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(0,245,160,0.7), 0 0 20px rgba(0,245,160,0.45), 0 0 40px rgba(0,245,160,0.2), 2px 2px 0 rgba(0,0,0,0.8), 3px 3px 0 rgba(0,0,0,0.6), 4px 4px 0 rgba(0,0,0,0.4);
      }

      .xh-wordmark::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -4px;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--green), var(--cyan), var(--green), transparent);
        border-radius: 2px;
      }

      .xh-logo-sub {
        font-size: 10px;
        letter-spacing: 6px;
        color: var(--text-dim);
        text-transform: uppercase;
        opacity: 0.9;
      }

      .xh-nav {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .xh-nav-btn {
        position: relative;
        border: 1px solid transparent;
        border-radius: 14px;
        background: transparent;
        color: var(--text-dim);
        padding: 10px 18px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .xh-nav-btn:hover {
        color: var(--text);
        background: rgba(255,255,255,0.04);
      }

      .xh-nav-btn.active {
        background: rgba(255,255,255,0.06);
        border-color: rgba(255,255,255,0.10);
        color: var(--text);
        box-shadow: 0 4px 20px rgba(0,245,160,0.10), inset 0 1px 0 rgba(255,255,255,0.08);
      }

      .xh-live-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.08);
        background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        color: var(--text-muted);
        box-shadow: 0 4px 18px rgba(0,0,0,0.18);
        font-size: 13px;
      }
      .push-enable-btn {
        border: 1px solid rgba(0,245,160,.28);
        border-radius: 999px;
        padding: 8px 12px;
        color: var(--green);
        background: linear-gradient(135deg, rgba(0,245,160,.12), rgba(0,212,245,.08));
        box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 4px 16px rgba(0,245,160,.08);
        cursor: pointer;
        white-space: nowrap;
      }
      .push-enable-btn:disabled { opacity: .65; cursor: default; }
      .push-toast {
        position: fixed;
        z-index: 12000;
        top: 16px;
        right: 50%;
        transform: translateX(50%) translateY(-14px);
        display: flex;
        align-items: center;
        gap: 11px;
        width: min(440px, calc(100vw - 28px));
        padding: 13px 15px;
        border: 1px solid rgba(0,245,160,.36);
        border-radius: 14px;
        color: var(--text);
        background: linear-gradient(115deg, rgba(5,25,20,.98), rgba(8,27,34,.98));
        box-shadow: 0 16px 46px rgba(0,0,0,.48), 0 0 24px rgba(0,245,160,.12);
        opacity: 0;
        pointer-events: none;
        transition: opacity .22s ease, transform .22s ease;
      }
      .push-toast[hidden] { display: none; }
      .push-toast.visible { opacity: 1; transform: translateX(50%) translateY(0); }
      .push-toast-mark { display:grid; place-items:center; flex:0 0 34px; height:34px; border-radius:10px; color:#04170f; background:linear-gradient(135deg,var(--green),var(--cyan)); font-weight:900; }
      .push-toast-copy { min-width:0; display:grid; gap:1px; }
      .push-toast-copy strong { color:var(--green); font-size:12px; }
      .push-toast-copy span { overflow:hidden; color:var(--text-muted); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }

      .xh-live-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 10px rgba(0,245,160,0.75);
        animation: xh-pulse 1.4s infinite ease-in-out;
      }

      .xh-live-count {
        color: var(--green);
        font-weight: 700;
      }

      .sync-key-btn {
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 7px;
        background: rgba(255,255,255,0.04);
        color: var(--text-muted);
        padding: 5px 8px;
        font-size: 11px;
        cursor: pointer;
      }

      @keyframes xh-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.42; transform: scale(0.86); }
      }

      .xh-body {
        padding: 24px 28px 34px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin-bottom: 22px;
      }

      .metric {
        padding: 18px 20px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.08);
        background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
        box-shadow: 0 10px 20px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.04);
      }

      .metric label {
        display: block;
        margin-bottom: 10px;
        font-size: 12px;
        color: var(--text-muted);
      }

      .metric strong {
        display: block;
        font-size: clamp(22px, 2.3vw, 30px);
        font-weight: 700;
        color: var(--text);
      }

      .overview-view[hidden] { display: none !important; }
      .overview-heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
      .overview-heading span { color: var(--text-dim); font-size: 11px; }
      .overview-heading h2 { margin: 3px 0 0; color: var(--text); font-size: 19px; }
      .overview-period { padding-bottom: 3px; }
      .overview-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
      .overview-block { min-width: 0; padding: 16px 18px; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; background: rgba(15,23,27,.72); }
      .overview-block h3 { margin: 0 0 12px; color: var(--text-muted); font-size: 12px; }
      .overview-stat, .overview-trade { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 38px; border-top: 1px solid rgba(255,255,255,.06); }
      .overview-stat span, .overview-trade span { color: var(--text-dim); font-size: 11px; }
      .overview-stat strong, .overview-trade > strong { direction: ltr; font-size: 12px; }
      .overview-recent { grid-column: 1 / -1; }
      .overview-list { display: flex; flex-direction: column; }
      .overview-trade > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .overview-trade > div strong { overflow: hidden; color: var(--text); text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
      .overview-empty { padding: 12px 0; color: var(--text-dim); font-size: 11px; }
      .overview-view .positive { color: var(--green); }
      .overview-view .negative { color: var(--red); }
      .overview-view .neutral { color: var(--yellow); }

      .calendar-wrap {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.9fr);
        gap: 18px;
      }
      .calendar-wrap[hidden] { display: none !important; }

      .xh-glass {
        border-radius: 22px;
        border: 1px solid rgba(255,255,255,0.08);
        background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.016));
        box-shadow: 0 20px 30px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.05);
      }

      .panel {
        padding: 14px;
      }

      .month-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
        padding: 2px 6px 8px;
      }

      .month-header strong {
        font-size: 16px;
        color: var(--text);
      }

      .month-header button,
      .action-btn,
      .mini-btn {
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .month-header button {
        width: 38px;
        height: 32px;
        font-size: 20px;
      }

      .action-btn {
        padding: 10px 16px;
        border: none;
        background: linear-gradient(135deg, var(--green), var(--cyan));
        color: #04170f;
        font-weight: 700;
        box-shadow: 0 10px 24px rgba(0,245,160,0.25);
      }

      .mini-btn {
        padding: 6px 10px;
        font-size: 11px;
      }

      .month-header button:hover,
      .action-btn:hover,
      .mini-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(0,245,160,0.35);
        background: rgba(0,245,160,0.06);
      }

      .days-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
      }

      .week-name {
        padding: 5px 0;
        font-size: 10px;
        text-align: center;
        color: var(--text-dim);
      }

      .day-cell {
        min-height: 82px;
        padding: 6px 4px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.07);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        cursor: pointer;
        transition: all 0.18s ease;
      }

      .day-cell:hover {
        border-color: rgba(0,245,160,0.28);
        background: rgba(255,255,255,0.04);
      }

      .day-cell.selected {
        border-color: rgba(0, 212, 245, 0.75);
        box-shadow: 0 0 0 1px rgba(0,212,245,0.18), 0 6px 24px rgba(0,212,245,0.10);
      }

      .day-cell.today:not(.green):not(.red) {
        border-color: rgba(0, 212, 245, 0.65);
        background: rgba(0, 212, 245, 0.09);
      }

      .day-cell.green {
        border-color: rgba(52, 211, 153, 0.42);
        background: rgba(52,211,153,0.08);
      }

      .day-cell.red {
        border-color: rgba(255, 74, 107, 0.42);
        background: rgba(255,74,107,0.08);
      }

      .day-cell.today.green,
      .day-cell.today.red {
        box-shadow: inset 0 0 0 1px rgba(0, 212, 245, 0.5);
      }

      .day-num {
        font-weight: 700;
        font-size: 12px;
      }

      .day-badges {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        flex-wrap: wrap;
        font-size: 9px;
      }

      .day-percent {
        min-height: 10px;
        font-size: 9px;
        font-weight: 700;
        line-height: 10px;
        direction: ltr;
      }

      .day-percent-empty { visibility: hidden; }

      .journal-chart-controls,
      .journal-chart-tool-settings {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
        min-width: 0;
      }

      .journal-chart-controls {
        padding: 8px;
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 7px;
        background: rgba(255,255,255,0.025);
      }

      .journal-chart-controls label,
      .chart-tool-field {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--text-dim);
        font-size: 10px;
      }

      .journal-chart-controls input,
      .journal-chart-controls select,
      .journal-chart-tool-settings input,
      .journal-chart-tool-settings select {
        min-height: 28px;
        padding: 4px 6px;
        border: 1px solid rgba(255,255,255,0.11);
        border-radius: 5px;
        background: #151d21;
        color: var(--text);
        font: inherit;
      }

      .journal-chart-controls button,
      .journal-chart-tool-settings button {
        flex: 0 0 auto;
        min-height: 30px;
        padding: 5px 8px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 5px;
        background: rgba(255,255,255,0.035);
        color: var(--text-muted);
        cursor: pointer;
        font: inherit;
        font-size: 10px;
      }

      .journal-chart-controls button:disabled,
      .journal-chart-tool-settings button:disabled { opacity: .4; cursor: not-allowed; }
      .journal-chart-tool-settings .chart-danger { border-color: rgba(255,74,107,.25); color: var(--red); }

      .journal-chart-tool-settings {
        display: flex;
        flex-direction: column;
        max-height: calc(100% - 24px);
        overflow: hidden;
      }
      .journal-chart-tool-settings[hidden] { display: none; }

      .journal-chart-workspace { position: relative; flex: 1; min-height: 300px; width: 100%; overflow: hidden; border: 1px solid rgba(255,255,255,.08); border-radius: 7px; background: #091014; }
      body.journal-chart-open { overflow: hidden; overscroll-behavior: none; }
      #journalChartModal { position: fixed; inset: 0; z-index: 10000; width: 100vw; height: 100vh; height: 100dvh; padding: 0; overflow: hidden; overscroll-behavior: none; background: #070b10; }
      #journalChartModal .journal-chart-modal-section { width: 100%; height: 100%; max-height: 100%; display: flex; flex-direction: column; gap: 8px; padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); border: 0; border-radius: 0; overflow: hidden; }
      #journalChartModal .journal-chart-modal-section { width: 100% !important; height: 100% !important; max-height: 100% !important; min-height: 0; box-sizing: border-box; }
      #journalChartModal .journal-chart-controls { flex: 0 0 auto; max-height: 25vh; overflow: auto; overscroll-behavior: contain; }
      #journalChartModal .journal-chart-workspace { flex: 1 1 0; min-height: 160px; overscroll-behavior: contain; }
      .journal-chart-workspace #journal-chart-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
      #journalChartModal .journal-chart-page-actions { display: flex; align-items: center; gap: 7px; }
      #journalChartModal [data-chart-fullscreen], #journalChartModal [data-close-chart] { min-width: 38px; min-height: 38px; padding: 6px 10px; border: 1px solid rgba(0,245,160,.28); border-radius: 8px; background: rgba(0,245,160,.08); color: #00f5a0; font-size: 18px; cursor: pointer; }
      #journalChartModal [data-chart-landscape] { min-width: 42px; min-height: 38px; padding: 6px 9px; border: 1px solid rgba(0,212,245,.3); border-radius: 8px; background: rgba(0,212,245,.08); color: #5be6ff; font-size: 12px; font-weight: 700; cursor: pointer; }
      #journalChartModal [data-close-chart] { border-color: rgba(255,74,107,.3); background: rgba(255,74,107,.08); color: #ff6b7f; }
      #journalChartModal.is-chart-only .journal-chart-controls,
      #journalChartModal.is-chart-only [data-chart-status],
      #journalChartModal.is-chart-only [data-pnl-banner],
      #journalChartModal.is-chart-only .journal-chart-footnote { display: none !important; }
      #journalChartModal.is-chart-only .journal-chart-workspace { min-height: 0; border: 0; border-radius: 0; }
      #journalChartModal.is-chart-only .journal-chart-modal-section { padding: max(6px, env(safe-area-inset-top)) 0 max(6px, env(safe-area-inset-bottom)); gap: 0; }
      #journalChartModal.is-chart-only .journal-chart-modal-section { gap: 0 !important; }
      #journalChartModal.is-chart-only .journal-chart-header { position: absolute; z-index: 20; top: max(8px, env(safe-area-inset-top)); right: 8px; left: 8px; pointer-events: none; }
      #journalChartModal.is-chart-only .journal-chart-header > * { pointer-events: auto; }
      #journalChartModal .journal-chart-address { color: #91a19c; font-size: 10px; font-weight: 400; direction: ltr; }
      #journalChartModal.is-chart-only .journal-chart-address { display: none; }
      #journalChartModal.is-chart-only .journal-tool-shelf { top: 56px; }
      #journalChartModal.is-chart-only .journal-floating-settings { top: 56px; }
      #journalChartModal.is-chart-only .journal-chart-workspace { flex: 1 1 0; width: 100%; height: auto; }
      #journalChartModal.is-landscape .journal-chart-controls,
      #journalChartModal.is-landscape [data-chart-status],
      #journalChartModal.is-landscape [data-pnl-banner],
      #journalChartModal.is-landscape .journal-chart-footnote { display: none !important; }
      #journalChartModal.is-landscape .journal-chart-modal-section { padding: max(6px, env(safe-area-inset-top)) 8px max(6px, env(safe-area-inset-bottom)); gap: 0; }
      #journalChartModal.is-landscape .journal-chart-workspace { flex: 0 0 auto; min-height: 0; width: 100%; height: auto; max-height: calc(100dvh - 58px); aspect-ratio: 16 / 9; border: 0; border-radius: 0; }
      #journalChartModal.is-landscape .journal-chart-header { flex: 0 0 auto; min-height: 44px; }
      @media (orientation: landscape) {
        #journalChartModal.is-landscape .journal-chart-workspace { flex: 1 1 0; height: auto; max-height: none; aspect-ratio: auto; }
        #journalChartModal.is-chart-only .journal-chart-workspace,
        #journalChartModal.is-landscape .journal-chart-workspace { height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
      }
      .journal-tool-shelf { position: absolute; z-index: 8; top: 10px; left: 10px; bottom: 10px; width: 190px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; background: rgba(14,22,26,.96); box-shadow: 0 10px 28px rgba(0,0,0,.38); transition: width .18s ease; }
      .journal-tool-shelf.collapsed { width: 42px; }
      .journal-shelf-head { display: flex; align-items: center; justify-content: space-between; min-height: 40px; padding: 5px 8px; border-bottom: 1px solid rgba(255,255,255,.08); color: #dce7e3; font-size: 11px; font-weight: 700; }
      .journal-shelf-toggle, .journal-shelf-tool { display: flex; align-items: center; justify-content: center; border: 1px solid transparent; background: transparent; color: #aebbb7; cursor: pointer; }
      .journal-shelf-toggle { width: 30px; height: 30px; border-radius: 5px; font-size: 17px; }
      .journal-shelf-body, .journal-tool-group { display: flex; flex-direction: column; gap: 4px; }
      .journal-shelf-body { gap: 10px; overflow: auto; padding: 8px; }
      .journal-tool-group strong { padding: 2px 5px 4px; color: #788984; font-size: 9px; }
      .journal-shelf-tool { justify-content: flex-start; gap: 9px; width: 100%; min-height: 34px; padding: 5px 8px; border-radius: 5px; text-align: right; font-size: 10px; }
      .journal-shelf-tool svg { flex: 0 0 18px; width: 18px; height: 18px; }
      .journal-shelf-tool:hover, .journal-shelf-tool.active { border-color: rgba(0,212,245,.38); background: rgba(0,212,245,.1); color: var(--cyan); }
      .journal-shelf-tool:disabled { opacity: .35; cursor: not-allowed; }
      .journal-tool-shelf.collapsed .journal-shelf-title, .journal-tool-shelf.collapsed .journal-shelf-body { display: none; }
      .journal-tool-shelf.collapsed .journal-shelf-head { justify-content: center; padding: 4px; }
      .journal-floating-settings { position: absolute; z-index: 10; top: 12px; left: 214px; width: min(340px,calc(100% - 230px)); max-height: calc(100% - 24px); overflow: hidden; border: 1px solid rgba(255,255,255,.17); border-radius: 8px; background: rgba(15,23,27,.98); box-shadow: 0 14px 36px rgba(0,0,0,.48); }
      .journal-floating-settings[hidden] { display: none; }
      .journal-settings-drag { display: flex; align-items: center; justify-content: space-between; min-height: 38px; padding: 5px 9px; border-bottom: 1px solid rgba(255,255,255,.09); background: #172126; color: #e4eeea; cursor: move; touch-action: none; user-select: none; }
      .journal-settings-drag > span { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 700; }
      .journal-settings-drag svg { width: 15px; height: 15px; color: var(--cyan); }
      .journal-settings-drag button { width: 26px; height: 26px; padding: 0; }
      .journal-chart-tool-settings { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; min-height: 0; max-height: calc(100vh - 190px); overflow: auto; padding: 9px; }
      .chart-tool-selected { display: flex; align-items: center; gap: 6px; flex-basis: 100%; color: var(--cyan); font-size: 10px; font-weight: 700; }
      .chart-tool-selected svg { width: 17px; height: 17px; }
      .journal-chart-tool-settings label { display: inline-flex; align-items: center; gap: 5px; color: var(--text-dim); font-size: 10px; }

      .chart-tool-selected { color: var(--cyan); font-size: 10px; font-weight: 700; }
      .chart-tool-hint { color: var(--text-dim); font-size: 10px; }
      .chart-text-field input { width: min(220px, 42vw); }

      .chart-fib-modal {
        position: absolute;
        inset: 45px 12px 12px;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        background: rgba(0,0,0,.68);
        border-radius: 8px;
      }
      .chart-fib-modal section {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(560px, 100%);
        max-height: 100%;
        padding: 12px;
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 8px;
        background: #11191d;
      }
      .chart-fib-modal header,
      .chart-fib-modal footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .fib-level-list { display: flex; flex-direction: column; gap: 4px; overflow: auto; }
      .fib-level-row { display: grid; grid-template-columns: 24px 28px minmax(70px,1fr) 48px 56px; gap: 6px; align-items: center; min-height: 32px; }
      .fib-level-row span { color: var(--text-dim); font: 10px var(--font-mono); direction: ltr; text-align: center; }

      @media (max-width: 560px) {
        .journal-chart-modal-section { padding: 9px !important; }
        #journalChartModal .journal-chart-modal-section { padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)) !important; }
        .journal-chart-controls { align-items: stretch; }
        .journal-chart-controls label { flex: 1 1 42%; justify-content: space-between; }
        #journalChartModal .journal-chart-workspace { min-height: 160px; }
        .journal-tool-shelf { top: 7px; left: 7px; bottom: 7px; width: 164px; }
        .journal-tool-shelf.collapsed { width: 40px; }
        .journal-floating-settings { top: auto; left: 54px; bottom: 8px; width: min(330px,calc(100% - 64px)); max-height: 48%; }
        .journal-chart-tool-settings { max-height: calc(48vh - 52px); align-items: stretch; }
        .chart-tool-field { flex: 1 1 42%; justify-content: space-between; }
      }

      .badge-win { color: var(--green); }
      .badge-loss { color: var(--red); }
      .badge-open { color: var(--yellow); }

      .detail-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 6px 12px;
      }

      .detail-head strong {
        font-size: 15px;
      }

      .trade-pnl {
        font-size: 12px;
        font-weight: 700;
        direction: ltr;
      }

      .detail-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 520px;
        overflow: auto;
        padding: 2px 2px 6px;
      }

      .trade-item {
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        background: rgba(255,255,255,0.02);
        padding: 10px 12px;
      }

      .trade-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .trade-token {
        font-weight: 700;
        font-size: 14px;
      }

      .trade-meta {
        margin-top: 5px;
        color: var(--text-dim);
        font-size: 11px;
      }

      .trade-actions {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }

      .mini-btn {
        padding: 6px 9px;
        font-size: 11px;
      }

      .empty {
        min-height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--text-dim); 
        padding: 12px;
        border: 1px dashed rgba(255,255,255,0.08);
        border-radius: 12px;
      }

      .xh-form-panel {
        margin-top: 22px;
        padding: 20px 18px 18px;
        scroll-margin-top: 12px;
      }

      .submit-form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field label {
        font-size: 12px;
        color: var(--text-muted);
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.09);
        background: rgba(11,16,20,0.82);
        color: var(--text);
        padding: 11px 12px;
        outline: none;
        transition: all 0.2s ease;
      }

      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: rgba(0,245,160,0.55);
        box-shadow: 0 0 0 4px rgba(0,245,160,0.08), 0 8px 24px rgba(0,245,160,0.08);
      }

      .field textarea {
        min-height: 90px;
        resize: vertical;
      }

      .action-btn {
        padding: 12px 16px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--green), var(--cyan));
        border: none;
        color: #04170f;
        box-shadow: 0 10px 24px rgba(0,245,160,0.25);
      }

      .field.actions {
        grid-column: 1 / -1;
        flex-direction: row;
        justify-content: flex-end;
        gap: 8px;
        position: sticky;
        bottom: 8px;
        z-index: 2;
        padding: 10px;
        border-radius: 12px;
        background: rgba(12, 18, 23, 0.96);
      }

      .save-status {
        grid-column: 1 / -1;
        color: var(--red);
        font-size: 13px;
      }

      .save-status[hidden] {
        display: none;
      }

      .image-previews {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .image-preview {
        display: grid;
        gap: 5px;
        width: min(140px, 42vw);
      }

      .image-preview img,
      .trade-item .image-previews img {
        width: 100%;
        height: 88px;
        object-fit: cover;
        border-radius: 6px;
      }

      @media (max-width: 900px) {
        .calendar-wrap {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .overview-grid { grid-template-columns: 1fr; }
        .overview-recent { grid-column: auto; }
        .overview-heading { align-items: start; flex-direction: column; }
        .push-enable-btn { padding: 7px 9px; font-size: 11px; }
        body {
          padding: 10px;
        }

        .xh-body {
          padding: 18px 16px 24px;
        }

        .xh-header {
          padding: 16px 18px;
        }

        .submit-form {
          grid-template-columns: minmax(0, 1fr);
        }

        .field.actions {
          position: sticky;
          bottom: 4px;
        }
      }
    </style>
  </head>
  <body>
    <div class="xh-root">
      <div class="xh-shell">
        <header class="xh-header">
          <div class="xh-brand">
            <div class="xh-wordmark">XAYNO</div>
            <div class="xh-logo-sub">journal</div>
          </div>

          <nav class="xh-nav" aria-label="main navigation">
            <button type="button" class="xh-nav-btn active" data-journal-view="journal">ژورنال</button>
            <button type="button" class="xh-nav-btn" data-journal-view="overview">نمای کلی</button>
          </nav>

          <button id="newTradeBtn" type="button" class="action-btn">+ ثبت معامله</button>
          <button type="button" id="pushEnableBtn" class="push-enable-btn" hidden>فعال‌سازی اعلان</button>
    <div id="pushToast" class="push-toast" role="status" aria-live="polite" hidden>
      <span class="push-toast-mark" aria-hidden="true">X</span>
      <span class="push-toast-copy"><strong>ژورنال جدید ثبت شد</strong><span data-push-toast-body></span></span>
    </div>

          <div class="xh-live-badge">
            <span class="xh-live-dot"></span>
            <span id="syncLabel">بررسی همگام‌سازی</span>
            <span id="syncState" class="xh-live-count">...</span>
            <button type="button" id="syncKeyBtn" class="sync-key-btn">تنظیم کلید</button>
          </div>
        </header>

        <main class="xh-body">
          <div class="summary-grid" id="summaryGrid"></div>

          <section id="overviewView" class="overview-view" hidden></section>

          <div class="calendar-wrap">
            <section class="xh-glass panel">
              <div class="month-header">
                <button id="prevMonthBtn" aria-label="ماه قبل">‹</button>
                <strong id="monthLabel">ماه</strong>
                <button id="nextMonthBtn" aria-label="ماه بعد">›</button>
              </div>
              <div class="days-grid" id="calendarGrid"></div>
            </section>

            <aside class="xh-glass panel">
              <div class="detail-head">
                <strong id="selectedDayLabel">روز</strong>
                <span id="selectedDayPnl" class="trade-pnl"></span>
              </div>
              <div id="selectedDayTrades" class="detail-card"></div>
            </aside>
          </div>

          <form id="tradeForm" class="xh-glass xh-form-panel" style="display: none;">
            <div class="submit-form">
              <input type="hidden" id="tradeId" />

              <div class="field">
                <label>روز ژورنال</label>
                <input type="date" id="journalDate" required />
              </div>

              <div class="field">
                <label>نام توکن</label>
                <input type="text" id="token" required />
              </div>

              <div class="field">
                <label>شبکه</label>
                <select id="network">
                  <option>Solana</option>
                  <option>Ethereum</option>
                  <option>Base</option>
                  <option>BSC</option>
                  <option>Arbitrum</option>
                  <option>سایر</option>
                </select>
              </div>

              <div class="field">
                <label>وضعیت</label>
                <select id="status">
                  <option value="closed">بسته‌شده</option>
                  <option value="open">باز</option>
                </select>
              </div>

              <div class="field">
                <label>آدرس قرارداد</label>
                <input type="text" id="address" />
              </div>

              <div class="field">
                <label>زمان ورود</label>
                <input type="datetime-local" id="openedAt" />
              </div>

              <div class="field">
                <label>زمان خروج</label>
                <input type="datetime-local" id="closedAt" />
              </div>

              <div class="field">
                <label>مارکت‌کپ ورود ($)</label>
                <input type="number" id="entryMarketCap" step="any" />
              </div>

              <div class="field">
                <label>مارکت‌کپ خروج ($)</label>
                <input type="number" id="exitMarketCap" step="any" />
              </div>

              <div class="field">
                <label>مبلغ پوزیشن ($)</label>
                <input type="number" id="investAmount" step="0.01" />
              </div>

              <div class="field">
                <label>درصد سود/ضرر</label>
                <input type="number" id="pnlPercent" step="0.01" />
              </div>

              <div class="field">
                <label>مقدار دلاری</label>
                <input type="number" id="pnlDollar" step="0.01" />
              </div>

              <div class="field">
                <label>نتیجه</label>
                <select id="pnlOutcome">
                  <option value="profit">سود</option>
                  <option value="loss">ضرر</option>
                </select>
              </div>

              <div class="field">
                <label>سطح ریسک</label>
                <select id="riskLevel">
                  <option value="low">کم</option>
                  <option value="medium">متوسط</option>
                  <option value="high">زیاد / پرریسک</option>
                </select>
              </div>

              <div class="field">
                <label>لینک تراکنش</label>
                <input type="url" id="txLink" />
              </div>

              <div class="field">
                <label>ستاپ / نوع ورود</label>
                <input type="text" id="setup" />
              </div>

              <div class="field">
                <label>چرا وارد شدم؟</label>
                <textarea id="entryReason"></textarea>
              </div>

              <div class="field">
                <label>چرا خارج شدم؟</label>
                <textarea id="exitReason"></textarea>
              </div>

              <div class="field">
                <label>حالت ذهنی</label>
                <textarea id="emotion"></textarea>
              </div>

              <div class="field">
                <label>اشتباه یا ریسک نادیده‌گرفته‌شده</label>
                <textarea id="mistakes"></textarea>
              </div>

              <div class="field">
                <label>درس معامله</label>
                <textarea id="lesson"></textarea>
              </div>

              <div class="field" style="grid-column: 1 / -1;">
                <label>یادداشت</label>
                <textarea id="notes"></textarea>
              </div>

              <div class="field" style="grid-column: 1 / -1;">
                <label for="tradeImages">تصاویر معامله (حداکثر ۳ عکس)</label>
                <input type="file" id="tradeImages" accept="image/*" multiple />
                <div id="imagePreviews" class="image-previews"></div>
              </div>

              <div class="field actions">
                <div id="saveStatus" class="save-status" role="status" aria-live="polite" hidden></div>
                <button type="button" id="cancelFormBtn" class="mini-btn">انصراف</button>
                <button type="submit" class="action-btn">ذخیره</button>
              </div>
            </div>
          </form>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/klinecharts@9.8.12/dist/umd/klinecharts.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
